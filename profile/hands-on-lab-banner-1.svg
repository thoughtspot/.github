<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 344" width="1280" height="344" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">git checkout ai-analytics: ThoughtSpot monthly hands-on lab</title>
  <desc id="d">AI analytics for your app. Data skills for your agent. A live, hands-on lab for developers, every month, free. Save your spot.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .branch { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.6s cubic-bezier(.3,.6,.2,1) .3s both; }
    .c { animation: pop .35s ease-out both; transform-box: fill-box; transform-origin: center; }
    .c1 { animation-delay: .55s } .c2 { animation-delay: .85s } .c3 { animation-delay: 1.15s } .c4 { animation-delay: 1.45s } .c5 { animation-delay: 1.8s }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes draw { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
    @keyframes pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: scale(1) } }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .branch, .c, .cursor { animation: none } }
  </style>

  <rect width="1280" height="344" rx="18" fill="#0B1B3F"/>

  <!-- header -->
  <text x="64" y="54" class="sans" font-size="22" font-weight="700" fill="#F3F6FC">ThoughtSpot</text>
  <text x="1216" y="54" class="sans" font-size="20" text-anchor="end" fill="#9DBBF2">Live every month. Free.</text>

  <!-- title -->
  <text x="64" y="114" class="mono" font-size="44" fill="#F3F6FC"><tspan fill="#5B86D6">$ </tspan>git checkout ai-analytics<tspan class="cursor" dx="4" fill="#FFB547">_</tspan></text>
  <text x="64" y="170" class="sans" font-size="38" font-weight="700" fill="#F3F6FC">AI analytics for your app. Data skills for your agent.</text>
  <text x="64" y="206" class="sans" font-size="22" fill="#9DBBF2">Your UI, your brand, your users’ data, with an AI analyst and agent skills built in.</text>

  <!-- git graph -->
  <line x1="64" y1="246" x2="940" y2="246" stroke="#5B86D6" stroke-width="3"/>
  <circle cx="64" cy="246" r="7" fill="#5B86D6"/>
  <circle cx="160" cy="246" r="7" fill="#5B86D6"/>
  <text x="64" y="274" class="mono" font-size="16" fill="#5B86D6">main</text>

  <path class="branch" pathLength="1" d="M160,246 C200,246 200,288 240,288 L780,288 C840,288 860,246 900,246"
        fill="none" stroke="#FFB547" stroke-width="4" stroke-linecap="round"/>

  <g fill="#0B1B3F" stroke="#FFB547" stroke-width="4">
    <circle class="c c1" cx="240" cy="288" r="9"/>
    <circle class="c c2" cx="420" cy="288" r="9"/>
    <circle class="c c3" cx="600" cy="288" r="9"/>
    <circle class="c c4" cx="780" cy="288" r="9"/>
